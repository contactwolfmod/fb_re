<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Kích hoạt Locket Gold</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0a0a0a;
      color: #e8d5a3;
      text-align: center;
      padding: 40px 16px;
      margin: 0;
    }
    .container {
      max-width: 420px;
      margin: 0 auto;
      background: linear-gradient(145deg, #150f00, #1e1500);
      border: 1.5px solid rgba(201,161,90,0.5);
      border-radius: 16px;
      padding: 30px 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }
    h2 { margin-top: 0; color: #d4aa5d; }
    p { color: #a3957a; font-size: 0.9rem; margin-bottom: 24px; }
    input {
      width: 100%;
      padding: 14px;
      border-radius: 8px;
      border: 1px solid rgba(201,161,90,0.3);
      background: rgba(0,0,0,0.5);
      color: #fff;
      font-size: 1rem;
      margin-bottom: 20px;
      box-sizing: border-box;
      outline: none;
    }
    input:focus { border-color: #d4aa5d; }
    
    .button-group {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    
    button {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    
    .btn-check {
      background: rgba(201,161,90,0.2);
      color: #d4aa5d;
      border: 1px solid rgba(201,161,90,0.5);
    }
    
    .btn-upgrade {
      background: linear-gradient(90deg, #b8860b, #d4aa5d);
      color: #000;
    }
    
    button:hover { opacity: 0.9; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    #result { margin-top: 10px; font-size: 1rem; font-weight: 500; line-height: 1.5; text-align: left; }
    
    .log-box {
      margin-top: 15px;
      background: rgba(0,0,0,0.8);
      border: 1px solid #333;
      border-radius: 8px;
      padding: 10px;
      font-family: monospace;
      font-size: 0.85rem;
      color: #a3957a;
      text-align: left;
      height: 150px;
      overflow-y: auto;
      display: none;
    }
    
    .success { color: #4ade80; }
    .error { color: #f87171; }
    .info { color: #60a5fa; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Nâng Cấp Locket Gold 💛</h2>
    <p>Nhập link hoặc username Locket để kiểm tra hoặc kích hoạt Gold</p>
    
    <input type="text" id="username" placeholder="Ví dụ: ngocquynh066" onkeydown="if(event.key==='Enter') upgradeGold()">
    
    <div class="button-group">
      <button onclick="checkGold()" id="btnCheck" class="btn-check">Kiểm tra</button>
      <button onclick="upgradeGold()" id="btnUpgrade" class="btn-upgrade">Nâng cấp Gold</button>
    </div>
    
    <div id="result"></div>
    <div id="logBox" class="log-box"></div>
  </div>

  <script>
    function setButtonsState(disabled) {
      document.getElementById('btnCheck').disabled = disabled;
      document.getElementById('btnUpgrade').disabled = disabled;
    }

    async function checkGold() {
      const username = document.getElementById('username').value.trim();
      const resultDiv = document.getElementById('result');
      const logBox = document.getElementById('logBox');
      
      if (!username) return;
      
      setButtonsState(true);
      logBox.style.display = 'none';
      resultDiv.innerHTML = "<span class='info'>Đang kiểm tra thông tin...</span>";
      
      try {
        const res = await fetch('/api-check', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username })
        });
        const data = await res.json();
        
        if (data.success) {
          if (data.has_gold) {
            resultDiv.innerHTML = `<span class='success'>✅ Tài khoản đang có Gold!<br>Hết hạn vào: <b>${data.expires}</b></span>`;
          } else {
            resultDiv.innerHTML = `<span class='error'>❌ Tài khoản chưa có Gold hoặc đã hết hạn.</span>`;
          }
        } else {
          resultDiv.innerHTML = `<span class='error'>⚠️ Lỗi: ${data.message}</span>`;
        }
      } catch (e) {
        resultDiv.innerHTML = `<span class='error'>⚠️ Lỗi kết nối server.</span>`;
      }
      
      setButtonsState(false);
    }
    
    async function upgradeGold() {
      const username = document.getElementById('username').value.trim();
      const resultDiv = document.getElementById('result');
      const logBox = document.getElementById('logBox');
      
      if (!username) return;
      
      setButtonsState(true);
      resultDiv.innerHTML = "<span class='info'>Đang tiến hành kích hoạt Gold...</span>";
      logBox.style.display = 'block';
      logBox.innerHTML = 'Đang gửi yêu cầu...<br>';
      
      try {
        const res = await fetch('/api/activate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username })
        });
        const data = await res.json();
        
        if (data.logs && data.logs.length > 0) {
          logBox.innerHTML = data.logs.join('<br>') + '<br>';
          logBox.scrollTop = logBox.scrollHeight;
        }
        
        if (data.success) {
          resultDiv.innerHTML = `<span class='success'>✅ Nâng cấp thành công!<br>Hết hạn vào: <b>${data.expires}</b></span>`;
        } else {
          resultDiv.innerHTML = `<span class='error'>❌ Nâng cấp thất bại: ${data.message}</span>`;
        }
      } catch (e) {
        resultDiv.innerHTML = `<span class='error'>⚠️ Lỗi kết nối server.</span>`;
      }
      
      setButtonsState(false);
    }
  </script>
</body>
</html>
