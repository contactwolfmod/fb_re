<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ket noi 9Router</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif; background: #0a0a0a; color: #e5e5e5; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
    .card { background: #141414; border: 1px solid #2a2a2a; border-radius: 16px; width: 100%; max-width: 400px; padding: 32px; box-shadow: 0 24px 64px rgba(0,0,0,0.6); }
    .logo { width: 60px; height: 60px; background: linear-gradient(135deg, #7c3aed, #4f46e5); border-radius: 16px; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; font-size: 28px; box-shadow: 0 8px 24px rgba(124,58,237,0.4); }
    .app-name { text-align:center; font-size: 11px; color: #555; margin-bottom: 4px; letter-spacing: 0.06em; text-transform: uppercase; }
    h1 { text-align:center; font-size: 20px; font-weight: 700; color: #fff; margin-bottom: 4px; }
    .subtitle { text-align:center; font-size: 13px; color: #666; margin-bottom: 24px; }
    .acct-card { background: #1a1a2e; border: 1px solid rgba(99,102,241,0.35); border-radius: 12px; padding: 16px 18px; margin-bottom: 20px; display: flex; align-items: center; gap: 14px; }
    .acct-avatar { width: 42px; height: 42px; background: linear-gradient(135deg, #6366f1, #7c3aed); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
    .acct-info { flex: 1; min-width: 0; }
    .acct-name { font-size: 15px; font-weight: 700; color: #e2e8f0; }
    .acct-sub { font-size: 11px; color: #6366f1; margin-top: 2px; }
    .acct-model { font-size: 10px; color: #4b5563; font-family: monospace; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .divider { border: none; border-top: 1px solid #1e1e1e; margin: 18px 0; }
    .scope-list { list-style: none; display: flex; flex-direction: column; gap: 9px; margin-bottom: 22px; }
    .scope-item { display: flex; align-items: center; gap: 10px; font-size: 13px; color: #888; }
    .scope-icon { color: #6366f1; font-size: 14px; flex-shrink: 0; }
    .error-box { background: rgba(239,68,68,0.08); border: 1px solid rgba(239,68,68,0.25); border-radius: 8px; padding: 10px 12px; font-size: 12px; color: #f87171; margin-bottom: 14px; display: none; }
    .btn-allow { width: 100%; padding: 14px; background: linear-gradient(135deg, #6366f1, #7c3aed); border: none; border-radius: 10px; color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; transition: opacity 0.15s, transform 0.1s; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-allow:hover { opacity: 0.88; }
    .btn-allow:active { transform: scale(0.98); }
    .btn-allow:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-cancel { width: 100%; padding: 10px; background: transparent; border: 1px solid #222; border-radius: 8px; color: #555; font-size: 13px; cursor: pointer; margin-top: 8px; transition: all 0.15s; }
    .btn-cancel:hover { border-color: #333; color: #888; }
    .spinner { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .footer { text-align: center; margin-top: 18px; font-size: 11px; color: #333; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">&#x26A1;</div>
    <div class="app-name">Bot Control &rarr; 9Router</div>
    <h1>Cho phep ket noi AI</h1>
    <div class="subtitle">{{ACCOUNT_LABEL}} xin phep ket noi bot voi AI.</div>
    {{ACCOUNT_BLOCK}}
    <hr class="divider" />
    <ul class="scope-list">
      <li class="scope-item"><span class="scope-icon">&#x2713;</span>Goi API AI tao phan hoi tin nhan</li>
      <li class="scope-item"><span class="scope-icon">&#x2713;</span>Doc danh sach model co san</li>
      <li class="scope-item"><span class="scope-icon">&#x2713;</span>Khong luu tru du lieu nguoi dung</li>
    </ul>
    <div id="error-box" class="error-box"></div>
    <form id="form" method="POST" action="/connect/9router/authorize">
      <input type="hidden" name="redirect" value="{{REDIRECT}}" />
      <input type="hidden" name="userToken" value="{{USER_TOKEN}}" />
      <button class="btn-allow" id="btn" type="submit">&#x2713;&nbsp;&nbsp;Cho phep ket noi</button>
      <button class="btn-cancel" type="button" onclick="if(window.opener){window.close();}else{history.back();}">Huy bo</button>
    </form>
    <div class="footer">WolfMod Bot &bull; 9Router AI Gateway</div>
  </div>
  <script>
    var params = new URLSearchParams(location.search);
    var err = params.get('error');
    if (err) { var box = document.getElementById('error-box'); box.style.display = 'block'; box.textContent = 'Loi: ' + decodeURIComponent(err); }
    var form = document.getElementById('form');
    var btn = document.getElementById('btn');
    form.addEventListener('submit', function() { btn.disabled = true; btn.innerHTML = '<div class="spinner"></div>&nbsp;Dang ket noi...'; });
  </script>
</body>
</html>
