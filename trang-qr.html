<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🧭 Mảnh Kho Báu Cuối Cùng</title>
  <!-- Thư viện qrcode.js qua CDN cdnjs -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    /* Reset & Khởi tạo */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #f4ecd8;
      background-image: 
        radial-gradient(#c9a15a 0.75px, transparent 0.75px),
        radial-gradient(#d5b882 0.75px, #f4ecd8 0.75px);
      background-size: 30px 30px;
      background-position: 0 0, 15px 15px;
      color: #3b220e;
      font-family: 'Georgia', 'Cambria', 'Times New Roman', serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 16px;
      line-height: 1.6;
    }

    .container {
      max-width: 540px;
      width: 100%;
      margin: 0 auto;
    }

    /* Thẻ phong cách giấy da cổ (Parchment Card) */
    .parchment-card {
      background: #fffcf4;
      border: 2px solid #c9a15a;
      border-radius: 14px;
      box-shadow: 
        0 8px 25px rgba(78, 52, 26, 0.14),
        inset 0 0 40px rgba(201, 161, 90, 0.08);
      padding: 36px 26px;
      text-align: center;
      position: relative;
      outline: 1px dashed #d5b882;
      outline-offset: -8px;
      animation: fadeIn 0.8s ease-out both;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card-title {
      font-size: 1.85rem;
      font-weight: bold;
      color: #4a2810;
      text-shadow: 1px 1px 2px rgba(201, 161, 90, 0.4);
      margin-bottom: 8px;
    }

    .card-divider {
      height: 2px;
      background: linear-gradient(90deg, transparent, #c9a15a, #8b5a2b, #c9a15a, transparent);
      margin: 14px auto 26px;
      width: 80%;
    }

    /* Khung chứa mã QR */
    .qr-frame-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 20px 0 24px;
    }

    .qr-frame {
      background: #ffffff;
      padding: 16px;
      border-radius: 12px;
      border: 2px solid #c9a15a;
      box-shadow: 0 4px 16px rgba(78, 52, 26, 0.15);
      display: inline-block;
    }

    #qrcode img, #qrcode canvas {
      display: block;
      margin: 0 auto;
    }

    /* Câu ẩn dụ */
    .metaphor-text {
      font-style: italic;
      color: #54371e;
      font-size: 1.05rem;
      line-height: 1.7;
      margin-top: 18px;
    }

    /* Responsive */
    @media (max-width: 480px) {
      body {
        padding: 20px 12px;
      }
      .parchment-card {
        padding: 26px 18px;
      }
      .card-title {
        font-size: 1.5rem;
      }
      .metaphor-text {
        font-size: 0.95rem;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <main class="parchment-card">
      <h1 class="card-title">🧭 Mảnh Kho Báu Cuối Cùng</h1>
      <div class="card-divider"></div>

      <!-- Khung hiển thị mã QR -->
      <div class="qr-frame-wrapper">
        <div class="qr-frame">
          <div id="qrcode"></div>
        </div>
      </div>

      <!-- Câu ẩn dụ -->
      <p class="metaphor-text">
        "Chạm ống kính vào ma trận đen trắng để đánh thức mật ngữ bên trong."
      </p>
    </main>
  </div>

  <script>
    (function() {
      // ══════════════════════════════════════════════════════════════
      // LINK ĐÍCH CUỐI CÙNG:
      // Chuỗi này sẽ được tự động đảo ngược bằng JavaScript
      // để đưa vào mã QR (người chơi quét QR sẽ thấy chuỗi ngược).
      // ══════════════════════════════════════════════════════════════
      var defaultHost = "https://fbre-production.up.railway.app";
      var currentOrigin = (window.location.protocol && window.location.protocol.startsWith("http"))
                            ? window.location.origin
                            : defaultHost;
      var FINAL_TARGET_URL = currentOrigin + "/nhuy";

      // Tự động đảo ngược chuỗi hoàn toàn bằng JavaScript
      var reversedUrl = FINAL_TARGET_URL.split('').reverse().join('');

      // Khởi tạo mã QR an toàn
      function initQr() {
        var qrElem = document.getElementById("qrcode");
        if (!qrElem) return;

        if (typeof QRCode !== "undefined") {
          qrElem.innerHTML = "";
          new QRCode(qrElem, {
            text: reversedUrl,
            width: 210,
            height: 210,
            colorDark: "#2c1810",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
          });
        } else {
          // Thử lại nếu thư viện CDN chưa tải xong
          setTimeout(initQr, 200);
        }
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", initQr);
      } else {
        initQr();
      }
    })();
  </script>
</body>
</html>
